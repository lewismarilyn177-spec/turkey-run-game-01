<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turkey Run: Escape the Feast</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="modulepreload" href="js/main.js">
</head>
<body style="background:#111;">
  <div id="stage-wrap">
    <canvas id="game-canvas" width="960" height="600"></canvas>
    <div id="hint-bar">
      <span class="key">←</span> <span class="key">→</span> run
      <span class="key">↑</span> jump (twice = flap)
      <span class="key">↓</span> slide
      <span class="key">P</span> pause
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
